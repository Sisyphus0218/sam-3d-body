[project]
name = "sam-3d-body"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "appdirs>=1.4.4",
    "appnope>=1.0.0",
    "black>=26.10.1",
    "chump>=1.6.0",
    "cython>=3.3.0",
    "decord>=0.6.0",
    "detectron2",
    "dill>=0.4.1",
    "einops>=0.8.2",
    "ffmpeg>=1.4",
    "fvcore>=0.1.5.post20221221",
    "huggingface-hub>=2.2.0",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.7",
    "hydra-submitit-launcher>=1.2.0",
    "joblib>=1.6.0",
    "jsonlines>=4.0.0",
    "loguru>=0.7.3",
    "moge",
    "networkx==3.2.1",
    "ninja>=1.13.2",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "optree>=0.20.0",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pycocotools>=2.0.11",
    "pyrender>=0.1.45",
    "pyrootutils>=1.0.4",
    "pytest>=9.1.1",
    "pytorch-lightning>=2.6.6",
    "rich>=15.0.0",
    "roma>=1.6.1",
    "sam-2",
    "sam3",
    "scikit-image>=0.26.0",
    "seaborn>=0.13.2",
    "setuptools>=78.1.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "wandb>=0.30.0",
    "webdataset>=1.0.2",
    "wheel>=0.48.0",
    "xtcocotools>=1.14.3",
    "yacs>=0.1.8",
]

[tool.uv]
package = false
no-build-isolation-package = ["detectron2", "sam-2"]
override-dependencies = ["iopath==0.1.10"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "a1ce2f9" }
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "07444410f1e33f402353b99d6ccd26bd31e469e8" }
sam3 = { git = "https://github.com/facebookresearch/sam3.git", rev = "660a5e9e1b8b4c02c0ad97229b88a09a6e4ff5b7" }
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
